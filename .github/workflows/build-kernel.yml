name: Build KSU + DroidSpaces Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. 检出内核源码
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: negrroo/LawRun_realme_sdm710
          path: kernel

      # 2. 下载 DroidSpaces 补丁
      - name: Download DroidSpaces non-GKI patches
        run: |
          mkdir -p patches
          cd patches
          wget -q https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch
          wget -q https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch

      # 3. 集成 KernelSU
      - name: Integrate KernelSU source
        working-directory: kernel
        run: |
          set -euo pipefail
          echo "=== Integrating KernelSU ==="
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/tiann/KernelSU.git drivers/kernelsu
          if grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            sed -i 's|source "drivers/kernelsu/Kconfig"|source "drivers/kernelsu/kernel/Kconfig"|' drivers/Kconfig
          else
            echo 'source "drivers/kernelsu/kernel/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q 'kernelsu' drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi
          if [ ! -f drivers/kernelsu/kernel/Kconfig ]; then
            echo "ERROR: KSU Kconfig not found!"
            exit 1
          fi
          echo "=== KernelSU integrated ==="

      # 4. 安装编译依赖 (增加 ARM32 交叉编译器)
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf flex bison bc libncurses-dev

      # 5. 应用 DroidSpaces 补丁
      - name: Apply DroidSpaces patches
        working-directory: kernel
        run: |
          PATCH1="../patches/01.fix_kernel_panic_in_xt_qtaguid.patch"
          [ -f net/netfilter/xt_qtaguid.c ] && patch -p1 < "$PATCH1" || echo "Skip 01"
          PATCH2="../patches/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"
          [ -f kernel/cgroup/cgroup.c ] && patch -p1 < "$PATCH2" || echo "Skip 02"

      # 6. 追加 DroidSpaces 配置
      - name: Append DroidSpaces configs
        working-directory: kernel
        run: |
          cat >> arch/arm64/configs/RMX1971_defconfig << 'EOF'
          # Droidspaces 核心支持
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          # 网络
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          EOF

      # 7. 编译内核 (设置 ARM32 交叉编译器)
      - name: Build kernel
        id: build
        working-directory: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export KCFLAGS="-Wno-error"

          make RMX1971_defconfig
          scripts/config --set-val LITTLE_CPU_MASK 15
          scripts/config --set-val BIG_CPU_MASK 48

          # 彻底移除 oppo_cfs 模块
          rm -rf kernel/oppocfs
          sed -i '/oppocfs/d' kernel/Makefile

          make olddefconfig
          make -j$(nproc) Image.gz dtbs 2>&1 | tee build.log
          
      # 8. Debug: 编译失败时自动提取错误行
      - name: Extract errors from build log
        if: steps.build.outcome == 'failure'
        working-directory: kernel
        run: |
          echo "================== BUILD ERRORS =================="
          grep -E -i "error:|fatal error|undefined reference|make\[.*\]: \*\*\*|No rule to make target|aborting" build.log || echo "No standard error patterns found. Check full build.log."
          echo "================== END OF ERRORS =================="

      # 9. 上传产物（编译成功时）
      - name: Upload kernel artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: KSU-Kernel-RMX1971
          path: |
            kernel/arch/arm64/boot/Image.gz
            kernel/arch/arm64/boot/dts/qcom/*.dtb
            kernel/build.log
