name: Build KSU + DroidSpaces Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. 检出内核源码
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: negrroo/LawRun_realme_sdm710
          path: kernel

      # 2. 下载 DroidSpaces 补丁
      - name: Download DroidSpaces non-GKI patches
        run: |
          mkdir -p patches
          cd patches
          wget -q https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch
          wget -q https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch

      # 3. ⚠️ 集成 KernelSU (必须运行，并确保成功)
      - name: Integrate KernelSU source
        working-directory: kernel
        run: |
          set -euo pipefail   # 任何错误都会立即退出
          echo "=== Integrating KernelSU ==="
          # 删除可能存在的空目录
          rm -rf drivers/kernelsu
          # 浅克隆 KernelSU 源码
          git clone --depth=1 https://github.com/tiann/KernelSU.git drivers/kernelsu
          # 确保 Kconfig 引用存在
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          # 验证关键文件确实存在
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "ERROR: drivers/kernelsu/Kconfig still missing after clone!"
            exit 1
          fi
          echo "=== KernelSU integration complete ==="

      # 4. 安装编译依赖
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu flex bison bc libncurses-dev

      # 5. 应用 DroidSpaces 补丁 (缺失文件自动跳过)
      - name: Apply DroidSpaces patches
        working-directory: kernel
        run: |
          echo "Applying patches..."
          PATCH1="../patches/01.fix_kernel_panic_in_xt_qtaguid.patch"
          if [ -f "net/netfilter/xt_qtaguid.c" ]; then
            patch -p1 < "$PATCH1"
            echo "Patch 01 applied."
          else
            echo "SKIPPED patch 01 (xt_qtaguid.c not found)"
          fi

          PATCH2="../patches/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"
          if [ -f "kernel/cgroup/cgroup.c" ]; then
            patch -p1 < "$PATCH2"
            echo "Patch 02 applied."
          else
            echo "SKIPPED patch 02 (cgroup.c not found)"
          fi

      # 6. 追加 DroidSpaces 配置
      - name: Append DroidSpaces config to defconfig
        working-directory: kernel
        run: |
          cat >> arch/arm64/configs/RMX1971_defconfig << 'EOF'
          # Droidspaces 核心支持
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          # Droidspaces 网络支持
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y

          # 旧版内核兼容 & 关键修复
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          EOF

      # 7. 编译内核
      - name: Build kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make RMX1971_defconfig
          make -j$(nproc) Image.gz dtbs 2>&1 | tee build.log

      # 8. 上传产物
      - uses: actions/upload-artifact@v4
        with:
          name: KSU-Kernel-RMX1971
          path: |
            kernel/arch/arm64/boot/Image.gz
            kernel/arch/arm64/boot/dts/qcom/*.dtb
            kernel/build.log
