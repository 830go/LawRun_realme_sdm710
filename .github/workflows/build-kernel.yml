name: Build Kernel with KSU and DroidSpaces

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. 检出你的内核源码 (LawRun)
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: negrroo/LawRun_realme_sdm710
          path: kernel

      # 2. 下载 DroidSpaces 官方补丁
      - name: Download DroidSpaces non-GKI patches
        run: |
          mkdir -p ${{ github.workspace }}/patches
          cd ${{ github.workspace }}/patches
          wget https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch
          wget https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch

      # 3. 集成 KernelSU 源码 (修复 "can't open file drivers/kernelsu/Kconfig")
      - name: Integrate KernelSU source
        working-directory: kernel
        run: |
          # 删除空的占位目录（如果有）
          rm -rf drivers/kernelsu
          # 克隆 KernelSU 源码到正确位置
          git clone https://github.com/tiann/KernelSU.git drivers/kernelsu
          # 确保 Kconfig 引用正确
          if ! grep -q "source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          echo "KernelSU integrated."

      # 4. 安装编译依赖
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc libncurses-dev

      # 5. 应用 DroidSpaces 补丁 (缺失文件自动跳过)
      - name: Apply official non-GKI patches (skip if file missing)
        working-directory: kernel
        run: |
          echo "Applying patches..."
          PATCH1="${{ github.workspace }}/patches/01.fix_kernel_panic_in_xt_qtaguid.patch"
          if [ -f "net/netfilter/xt_qtaguid.c" ]; then
            patch -p1 < "$PATCH1" || exit 1
            echo "Patch 01 applied."
          else
            echo "SKIPPED patch 01 (file not found)"
          fi

          PATCH2="${{ github.workspace }}/patches/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"
          if [ -f "kernel/cgroup/cgroup.c" ]; then
            patch -p1 < "$PATCH2" || exit 1
            echo "Patch 02 applied."
          else
            echo "SKIPPED patch 02 (file not found)"
          fi

      # 6. 追加 DroidSpaces 必要配置到 RMX1971_defconfig
      - name: Append DroidSpaces configs
        working-directory: kernel
        run: |
          cat >> arch/arm64/configs/RMX1971_defconfig << 'EOF'
          # Droidspaces 核心支持
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          # Droidspaces 网络支持
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y

          # 旧版内核兼容 & 关键修复
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          EOF

      # 7. 编译内核
      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make RMX1971_defconfig
          make -j$(nproc) Image.gz dtbs 2>&1 | tee build.log

      # 8. 上传产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KSU-Kernel-RMX1971
          path: |
            kernel/arch/arm64/boot/Image.gz
            kernel/arch/arm64/boot/dts/qcom/*.dtb
            kernel/build.log
