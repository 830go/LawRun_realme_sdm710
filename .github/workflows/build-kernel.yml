name: Build Kernel with DroidSpaces Patches (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. 检出你的内核源码
      - name: Checkout kernel source
        uses: actions/checkout@v4


      # 2. 获取官方补丁文件
      - name: Download DroidSpaces non-GKI patches
        run: |
          mkdir -p ${{ github.workspace }}/patches
          cd ${{ github.workspace }}/patches
          wget https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch
          wget https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch

      # 3. 安装编译依赖
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc libncurses-dev

      # 4. 应用官方补丁 (Step 3)
      - name: Apply official non-GKI patches (with file existence check)
        working-directory: kernel
        run: |
          echo "Checking and applying DroidSpaces official non-GKI patches..."
          
          # 补丁1：修复 xt_qtaguid 内核 panic
          PATCH1="${{ github.workspace }}/patches/01.fix_kernel_panic_in_xt_qtaguid.patch"
          if [ -f "net/netfilter/xt_qtaguid.c" ]; then
            echo "==> Applying 01.fix_kernel_panic_in_xt_qtaguid.patch"
            patch -p1 < "$PATCH1" || { echo "ERROR: Failed to apply $PATCH1"; exit 1; }
          else
            echo "==> SKIPPED 01.fix_kernel_panic_in_xt_qtaguid.patch (xt_qtaguid.c not found in source)"
          fi
          
          # 补丁2：修复 cgroup 文件前缀处理
          PATCH2="${{ github.workspace }}/patches/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"
          # 该补丁通常修改 kernel/cgroup/cgroup.c，先检测
          if [ -f "kernel/cgroup/cgroup.c" ]; then
            echo "==> Applying 02.fix_restore cgroup file prefix handling.patch"
            patch -p1 < "$PATCH2" || { echo "ERROR: Failed to apply $PATCH2"; exit 1; }
          else
            echo "==> SKIPPED 02.fix_restore cgroup file prefix handling.patch (cgroup.c not found in source)"
          fi
          
          echo "Patch application phase completed."

      # 5. 配置内核 (Step 1 & 关键修复)
      - name: Configure kernel with DroidSpaces options
        working-directory: kernel
        run: |
          cat >> arch/arm64/configs/sdm710_defconfig << 'EOF'
          # Droidspaces 核心支持 (Step 1)
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          # Droidspaces 网络支持 (Step 1)
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y

          # 旧版内核兼容 & 关键修复 (Step 1)
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          EOF

      # 6. 编译内核
      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make sdm710_defconfig
          make -j$(nproc) Image.gz dtbs 2>&1 | tee build.log

      # 7. 上传编译产物
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-Fixed
          path: |
            kernel/arch/arm64/boot/Image.gz
            kernel/arch/arm64/boot/dts/qcom/*.dtb
            kernel/build.log
